<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetEngine — C++ Networking Library Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060c18;--s1:#0c1829;--s2:#112133;--ink:#c5d6ea;--dim:#5e7899;--ln:#1a2e44;--bl:#4d94ff;--or:#f07838;--gn:#3dbf6e;--pu:#a07ef0;--cy:#38c4d4;--co:#040c18;--sh:0 4px 20px rgba(0,0,0,.55);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-t="dark"]){--bg:#f0f4fb;--s1:#fff;--s2:#e8eef8;--ink:#0d1e35;--dim:#607a99;--ln:#ccd8ea;--co:#f7f9fc;color-scheme:light}}
:root[data-t="light"]{--bg:#f0f4fb;--s1:#fff;--s2:#e8eef8;--ink:#0d1e35;--dim:#607a99;--ln:#ccd8ea;--co:#f7f9fc;color-scheme:light}
:root[data-t="dark"]{--bg:#060c18;--s1:#0c1829;--s2:#112133;--ink:#c5d6ea;--dim:#5e7899;--ln:#1a2e44;--co:#040c18;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
code,pre,.mono{font-family:'Fira Code',Consolas,monospace}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex-shrink:0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--bl);outline-offset:2px}

/* ── header ─────────────────────── */
header{position:sticky;top:0;z-index:30;height:58px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0)}
.hbar{display:flex;align-items:center;gap:12px;padding:0 20px;height:58px;max-width:1600px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;white-space:nowrap;flex-shrink:0}
.logob{background:linear-gradient(135deg,var(--bl),#2060c8);color:#fff;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:.85rem}
.ver{font-size:.7rem;padding:2px 9px;border-radius:4px;background:color-mix(in srgb,var(--bl) 12%,transparent);color:var(--bl);font-family:'Fira Code',monospace;border:1px solid color-mix(in srgb,var(--bl) 25%,transparent);flex-shrink:0}
.srch{flex:1;max-width:400px;position:relative;display:flex;align-items:center;margin-left:auto}
.srch svg{position:absolute;left:11px;color:var(--dim);pointer-events:none}
#q{width:100%;height:36px;padding:0 70px 0 36px;border-radius:5px;border:1px solid var(--ln);background:var(--s1);color:var(--ink);font:inherit;font-size:14px;-webkit-appearance:none}
#q:focus{border-color:var(--bl);outline:none}
#rc{position:absolute;right:34px;font-size:.7rem;color:var(--dim);pointer-events:none;font-family:'Fira Code',monospace}
#scl{position:absolute;right:7px;width:24px;height:24px;border-radius:4px;border:0;background:var(--s2);color:var(--dim);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:1rem;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:5px;border:1px solid var(--ln);background:var(--s1);color:var(--ink);cursor:pointer;font:inherit;font-size:.85rem;flex-shrink:0}
.btn:hover{border-color:var(--bl);color:var(--bl)}
#mb{display:none}

/* ── layout ─────────────────────── */
.wrap{display:grid;grid-template-columns:230px 1fr;max-width:1600px;margin:auto}

/* ── sidebar ─────────────────────── */
nav{position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;padding:16px 10px 40px;border-right:1px solid var(--ln);scrollbar-width:thin}
nav h6{font-size:.68rem;font-weight:600;letter-spacing:.09em;color:var(--dim);margin:14px 10px 5px;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:.88rem;font-weight:500}
nav a:hover{background:var(--s2)}
nav a.on{background:color-mix(in srgb,var(--bl) 15%,transparent);color:var(--bl)}
nav .sf{padding-left:30px;font-size:.78rem;color:var(--dim);font-weight:400;font-family:'Fira Code',monospace}
nav .sf:hover{color:var(--ink)}
nav .sf.on{color:var(--bl)}

/* ── main ─────────────────────── */
main{padding:32px clamp(14px,4vw,48px) 80px;min-width:0}

/* ── hero ─────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:10px;padding:clamp(20px,4vw,44px);margin-bottom:22px;background:#08111f;border:1px solid var(--ln)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 70% at 90% 50%,rgba(77,148,255,.14),transparent),radial-gradient(ellipse 40% 40% at 10% 80%,rgba(161,126,240,.08),transparent);pointer-events:none}
.hero-g{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;position:relative;z-index:1}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;color:#e8f2ff;line-height:1.2;margin-bottom:8px}
.hero p{color:#7a9bbd;font-size:.95rem;max-width:560px;margin-bottom:18px}
.htags{display:flex;flex-wrap:wrap;gap:7px}
.htag{font-family:'Fira Code',monospace;font-size:.72rem;padding:3px 10px;border-radius:4px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:#7a9bbd}
.arch-svg{flex-shrink:0}
/* stats row */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:7px;padding:12px 14px}
.stat strong{display:block;font-size:1.7rem;color:var(--bl);line-height:1.1;font-weight:700}
.stat span{color:var(--dim);font-size:.78rem}

/* ── module sections ─────────────────────── */
.mod{margin-top:48px;scroll-margin-top:70px}
.mhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.mic{width:44px;height:44px;border-radius:7px;background:var(--s2);border:1px solid var(--ln);display:grid;place-items:center;font-size:1.2rem;flex-shrink:0}
.minfo h2{font-size:1.4rem;font-weight:700;color:var(--ink);line-height:1.2}
.minfo .inc{font-family:'Fira Code',monospace;font-size:.75rem;color:var(--bl);margin-top:3px}
.mdesc{color:var(--dim);max-width:760px;margin-bottom:16px;font-size:.92rem}

/* ── enum / struct defs ─────────────────────── */
.typedef{background:var(--s1);border:1px solid var(--ln);border-radius:7px;padding:14px 16px;margin-bottom:14px}
.tdlabel{font-size:.7rem;color:var(--dim);margin-bottom:7px;font-family:'Fira Code',monospace}
.tdlabel span{color:var(--pu)}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ev span{font-family:'Fira Code',monospace;font-size:.75rem;padding:3px 10px;border-radius:4px;background:var(--s2);border:1px solid color-mix(in srgb,var(--pu) 20%,transparent);color:var(--pu)}
.ev span s{color:var(--dim);text-decoration:none}
.sfields{margin-top:8px;display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;font-family:'Fira Code',monospace;font-size:.78rem}
.sfields .ft{color:var(--pu)}.sfields .fn{color:#e0ecff}.sfields .fc{color:var(--dim)}

/* ── fn group separator ─────────────────────── */
.fng{font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--dim);margin:18px 0 8px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.fng::after{content:'';flex:1;height:1px;background:var(--ln)}

/* ── function cards ─────────────────────── */
.fn{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:7px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.fn:hover{border-color:color-mix(in srgb,var(--bl) 50%,var(--ln))}
.fnbar{width:4px;flex-shrink:0;background:var(--dim)}
.fnbar.bl{background:var(--bl)}.fnbar.gn{background:var(--gn)}.fnbar.or{background:var(--or)}.fnbar.pu{background:var(--pu)}.fnbar.cy{background:var(--cy)}.fnbar.wh{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.fnbd{flex:1;padding:13px 15px;min-width:0}
.fntop{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:5px}
.fnname{font-family:'Fira Code',monospace;font-size:1.05rem;font-weight:500;color:#ddeeff}
.fnst{font-size:.67rem;padding:2px 7px;border-radius:3px;background:color-mix(in srgb,var(--bl) 12%,transparent);color:var(--bl);border:1px solid color-mix(in srgb,var(--bl) 22%,transparent);font-family:'Fira Code',monospace;letter-spacing:.03em}
.fnret{font-family:'Fira Code',monospace;font-size:.73rem;padding:2px 9px;border-radius:3px;margin-left:auto}
.fnret.gb{background:color-mix(in srgb,var(--gn) 14%,transparent);color:var(--gn);border:1px solid color-mix(in srgb,var(--gn) 22%,transparent)}
.fnret.vb{background:color-mix(in srgb,var(--dim) 14%,transparent);color:var(--dim);border:1px solid color-mix(in srgb,var(--dim) 22%,transparent)}
.fnret.ob{background:color-mix(in srgb,var(--or) 14%,transparent);color:var(--or);border:1px solid color-mix(in srgb,var(--or) 22%,transparent)}
.fnret.pb{background:color-mix(in srgb,var(--pu) 14%,transparent);color:var(--pu);border:1px solid color-mix(in srgb,var(--pu) 22%,transparent)}
.fnret.cb{background:color-mix(in srgb,var(--cy) 14%,transparent);color:var(--cy);border:1px solid color-mix(in srgb,var(--cy) 22%,transparent)}
.fnsig{font-family:'Fira Code',monospace;font-size:.8rem;background:var(--co);border:1px solid var(--ln);border-radius:5px;padding:10px 13px;margin:7px 0 10px;overflow-x:auto;white-space:pre;line-height:1.65;direction:ltr}
.fndesc{font-size:.88rem;color:var(--dim);margin-bottom:10px;line-height:1.6}
/* param table */
.pt-wrap{overflow-x:auto;border:1px solid var(--ln);border-radius:6px}
table.pt{width:100%;border-collapse:collapse;font-size:.8rem}
table.pt th{text-align:left;padding:6px 12px;color:var(--dim);font-weight:500;border-bottom:1px solid var(--ln);background:var(--s2);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em}
table.pt td{padding:7px 12px;border-bottom:1px solid color-mix(in srgb,var(--ln) 50%,transparent);vertical-align:top}
table.pt tr:last-child td{border:none}
table.pt tr:nth-child(even) td{background:color-mix(in srgb,var(--s2) 55%,transparent)}
.ty{color:var(--pu);font-family:'Fira Code',monospace;font-size:.77rem;white-space:nowrap}
.pn{color:#ddeeff;font-family:'Fira Code',monospace;font-weight:500}
.di{font-size:.82rem;color:var(--dim)}
.dr{font-size:.67rem;padding:1px 7px;border-radius:3px;font-family:'Fira Code',monospace;white-space:nowrap}
.dr.in{background:color-mix(in srgb,var(--bl) 12%,transparent);color:var(--bl);border:1px solid color-mix(in srgb,var(--bl) 20%,transparent)}
.dr.out{background:color-mix(in srgb,var(--or) 12%,transparent);color:var(--or);border:1px solid color-mix(in srgb,var(--or) 20%,transparent)}

/* ── notes ─────────────────────── */
.note{display:flex;gap:9px;padding:9px 13px;border-radius:6px;font-size:.85rem;margin:10px 0}
.note.warn{background:color-mix(in srgb,var(--or) 10%,transparent);border:1px solid color-mix(in srgb,var(--or) 22%,transparent);color:#c8976a}
.note.info{background:color-mix(in srgb,var(--bl) 10%,transparent);border:1px solid color-mix(in srgb,var(--bl) 22%,transparent);color:#7aaad4}
.note svg{flex-shrink:0;margin-top:3px}

/* ── code boxes ─────────────────────── */
.cb{border-radius:7px;overflow:hidden;border:1px solid var(--ln);margin:14px 0}
.cbh{display:flex;align-items:center;justify-content:space-between;padding:7px 13px;background:var(--s2);font-size:.72rem;color:var(--dim)}
.cbh .dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cbh .dots i:nth-child(1){background:#ff5f57}.cbh .dots i:nth-child(2){background:#febc2e}.cbh .dots i:nth-child(3){background:#28c840}
.cpc{background:transparent;border:1px solid color-mix(in srgb,var(--ln) 80%,transparent);color:var(--dim);border-radius:4px;padding:3px 9px;cursor:pointer;font:inherit;font-size:.72rem;display:flex;align-items:center;gap:5px}
.cpc:hover{color:var(--ink);border-color:var(--dim)}
.cbh .file{font-family:'Fira Code',monospace}
pre{margin:0;padding:14px 16px;overflow-x:auto;background:var(--co);direction:ltr;line-height:1.75;font-size:.82rem;color:#c0d4ec}
.kw{color:#79b4f7}.ty2{color:#a78bfa}.fn2{color:#7dd3fc}.st2{color:#86efac}.cm2{color:#3d6080;font-style:italic}.nm2{color:#fbbf24}

/* ── empty / footer ─────────────────────── */
#empty{display:none;text-align:center;color:var(--dim);padding:50px;font-size:.95rem}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--ln);color:var(--dim);font-size:.8rem;text-align:center}

/* ── responsive ─────────────────────── */
@media(max-width:880px){.wrap{grid-template-columns:1fr}nav{position:fixed;inset:0 0 0 auto;width:255px;z-index:40;background:var(--bg);transform:translateX(100%);transition:transform .22s;top:0;height:100%;padding-top:calc(16px + env(safe-area-inset-top,0))}nav.open{transform:none}#mb{display:inline-flex!important}.hero-g{grid-template-columns:1fr}.arch-svg{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header>
<div class="hbar">
  <button class="btn" id="mb" aria-label="Toggle nav"><svg class="ic"><use href="#i-menu"/></svg></button>
  <a class="logo" href="#top"><span class="logob"><svg class="ic"><use href="#i-net"/></svg></span>NetEngine</a>
  <span class="ver">Windows · C++17</span>
  <div class="srch">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="q" type="text" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Search functions… ( / )">
    <span id="rc"></span>
    <button id="scl" aria-label="Clear">×</button>
  </div>
  <button class="btn" id="thm" aria-label="Toggle theme"><svg class="ic"><use href="#i-moon"/></svg></button>
</div>

<div class="wrap">
<nav id="nav"></nav>
<main id="main">
  <div id="top"></div>
  <div class="stats" id="stats"></div>
  <div id="mods"></div>
  <div id="empty">No functions match your search. Try a different term.</div>

<script>
// ── data ──────────────────────────────────────────────────
const D=[
{id:'winsock',g:'Platform',ic:'⚡',h:'Winsock.hpp',t:'Winsock',
d:'Manages the Winsock library lifetime via a guarded static flag. Must be initialized before any socket operations and cleaned up at application exit.',
fns:[
{n:'Initialize',r:'bool',st:1,p:[],d:'Calls WSAStartup(2.2). Guards against double-init with m_Initialized. Returns false and logs to cerr if startup fails.'},
{n:'Cleanup',r:'void',st:1,p:[],d:'Calls WSACleanup() and resets m_Initialized to false. No-op if Initialize was never called.'}
],
ex:`if (!Winsock::Initialize()) {
    std::cerr << "WSA init failed\\n";
    return -1;
}
// ... all socket code runs here ...
Winsock::Cleanup();`},

{id:'address',g:'Core',ic:'📍',h:'Address.hpp',t:'Address',
d:'Wraps sockaddr_in to represent an IPv4 endpoint. All fields are stored internally; callers retrieve a raw sockaddr* compatible with Winsock socket calls.',
fns:[
{n:'Address',r:'ctor',st:0,p:[],d:'Zero-initializes sockaddr_in via memset and sets sin_family to AF_INET.'},
{n:'Address',r:'ctor',st:0,p:[['const std::string&','ip','in','IPv4 string, e.g. "127.0.0.1".'],['unsigned short','port','in','Port in host byte order.']],d:'Convenience overload — directly calls SetAddress(ip, port).'},
{n:'SetAddress',r:'bool',st:0,p:[['const std::string&','ip','in','Passed to inet_pton(AF_INET). Must be a valid dotted-decimal string.'],['unsigned short','port','in','Stored as htons(port) in sin_port.']],d:'Zero-fills the struct, sets AF_INET and the converted port, then calls inet_pton. Returns false if inet_pton returns ≤ 0 (bad address format).'},

{n:'GetLength',r:'int',st:0,p:[],d:'Returns sizeof(sockaddr_in). Pass this as the addrlen argument alongside GetSockAddr().'}
],
ex:`Address srv("192.168.1.10", 9000);
socket.Connect(srv);

// Or for a server:
Address any("0.0.0.0", 9000);
socket.Bind(any);`},

{id:'socket',g:'Core',ic:'🔌',h:'Socket.hpp',t:'Socket',

{n:'ReceiveResult',vals:['Success','ConnectionClosed','InvalidHeader','PayloadTooLarge','Timeout','ReceiveFailed'],d:'Detailed outcome of the last ReceivePacket call.'}
],
structs:[
{n:'ClientSession',fields:[['uint32_t','SessionID — unique auto-incremented ID'],['SOCKET','SocketHandle — raw Winsock handle for this client'],['std::string','IPAddress — remote IP as string'],['uint16_t','port — remote port'],['uint64_t','LastBeaconTime — last activity timestamp'],['bool','IsActive — session health flag']]},
],
fns:[
{grp:'Lifecycle',n:'Create',r:'bool',st:0,
p:[['int','af','in','Address family (default AF_INET).'],['int','type','in','Socket type (default SOCK_STREAM).'],['int','protocol','in','Protocol (default IPPROTO_TCP).']],
d:'Allocates the underlying SOCKET handle. Sets state to Created on success. Stores WSA error on failure.'},
{grp:'Lifecycle',n:'Close',r:'void',st:0,p:[],d:'Shuts down and closes the socket handle, sets state to Closed. Safe to call multiple times.'},
{grp:'Lifecycle',n:'isValid',r:'bool',st:0,p:[],d:'Returns true when the internal SOCKET handle is not INVALID_SOCKET.'},
{grp:'Lifecycle',n:'IsConnected',r:'bool',st:0,p:[],d:'Returns true when the internal SocketState equals Connected.'},
{grp:'Client I/O',n:'Connect',r:'bool',st:0,p:[['const Address&','address','in','Target endpoint wrapping a valid sockaddr_in.']],d:'Calls connect() with the sockaddr from address. On success advances state to Connected and clears last error.'},
{grp:'Client I/O',n:'Send',r:'int',st:0,p:[['const void*','buffer','in','Pointer to data bytes to transmit.'],['int','length','in','Number of bytes to send.']],d:'Calls send(). Returns the number of bytes actually sent, or SOCKET_ERROR on failure (error stored internally).'},
{grp:'Client I/O',n:'Receive',r:'int',st:0,p:[['void*','buffer','out','Destination buffer for incoming bytes.'],['int','length','in','Maximum byte count to receive.']],d:'Calls recv(). Returns bytes received, 0 on graceful close, or SOCKET_ERROR.'},

const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(src){
  return e(src)
    .replace(/(\/\/[^\n]*)/g,'<span class=cm2>$1</span>')
    .replace(/"([^"]*)"/g,'<span class=st2>"$1"</span>')
    .replace(/\b(if|else|return|const|auto|for|while|nullptr|true|false|static|class|struct|enum|public|private|using|namespace|void|bool|int|uint32_t|uint16_t|uint8_t|uint64_t|std)\b/g,'<span class=kw>$1</span>')
    .replace(/\b([A-Z]\w+)(?=::)/g,'<span class=ty2>$1</span>')
    .replace(/\b([a-zA-Z_]\w*)(?=\()/g,'<span class=fn2>$1</span>');
}
function retBar(r){
  if(!r||r==='ctor'||r==='void') return 'wh';
  if(r==='bool') return 'gn';
  if(r==='int') return 'or';
  if(r.includes('vector')) return 'cy';
  if(r.includes('*')||r==='PacketType'||r==='ReceiveResult'||r==='Socket') return 'pu';
  return 'bl';
}
function retBadge(r){
  const cls={gn:'gb',void:'vb',ctor:'vb',int:'ob',uint:'ob'}[r]||
    (r.includes('vector')?'cb':r.includes('*')||['PacketType','ReceiveResult','Socket','std::string'].includes(r)?'pb':'ob');
  return `<span class="fnret ${cls}">${e(r||'ctor')}</span>`;
}
function sigLine(m,f){
  const nm=f.n.split(' / ')[0];
  const params=f.p.map(p=>`\n    ${e(p[0])} ${e(p[1])}`).join(',');
  const closing=f.p.length?'\n)':')';
  const ret=f.r&&f.r!=='ctor'?`<span class=kw>${e(f.r)}</span> `:'';
  const cls=`<span class=ty2>${e(m.id)}</span><span style="color:var(--dim)">::</span>`;
  const fn=`<span class=fn2>${e(nm)}</span>`;
  return `${ret}${cls}${fn}(${params}${closing};`;
}
function cb(src,label){
  return `<div class="cb"><div class="cbh"><span class="dots"><i></i><i></i><i></i></span><span class="file">${label}</span><button class="cpc" data-c="${encodeURIComponent(src)}"><svg class="ic"><use href="#i-copy"/></svg>Copy</button></div><pre><code>${hl(src)}</code></pre></div>`;
}

      const ptHTML=hasParams?`<div class="pt-wrap"><table class="pt">
        <thead><tr><th>Parameter</th><th>Type</th><th>Direction</th><th>Description</th></tr></thead>
        <tbody>${f.p.map(p=>`<tr><td><span class="pn">${e(p[1])}</span></td><td><span class="ty">${e(p[0])}</span></td><td><span class="dr ${p[2]}">${p[2]}</span></td><td class="di">${p[3]}</td></tr>`).join('')}</tbody>
        </table></div>`:'';
      fHTML+=`<article class="fn ${bar}" data-s="${(m.id+' '+f.n+' '+f.d+' '+f.p.map(p=>p.join(' ')).join(' ')).toLowerCase()}">
        <div class="fnbar ${bar}"></div>
        <div class="fnbd">
          <div class="fntop">${f.st?`<span class="fnst">static</span>`:''}<span class="fnname">${e(f.n)}</span>${retBadge(f.r)}</div>
          <div class="fnsig">${sigLine(m,f)}</div>
          <p class="fndesc">${f.d}</p>
          ${ptHTML}
        </div></article>`;
    });
  });

  // notes
  let nHTML='';
  if(m.notes) m.notes.forEach(n=>nHTML+=`<div class="note ${n.t}"><svg class="ic"><use href="#i-${n.t==='warn'?'warn':'info'}"/></svg><span>${n.txt}</span></div>`);

  modsHTML+=`<section class="mod" id="${m.id}" data-mod="${m.id}">
    <div class="mhead"><div class="mic">${m.ic}</div><div class="minfo"><h2>${m.t}</h2><div class="inc">#include "${m.h}"</div></div></div>
    <p class="mdesc">${m.d}</p>
    ${eHTML}
    ${m.fns.length?`<div class="fng">Functions</div>${fHTML}`:''}
    ${nHTML}
    ${m.ex?cb(m.ex,m.h.replace('.hpp','.cpp')):''}
  </section>`;
});
document.getElementById('mods').innerHTML=modsHTML;

// ── search ──────────────────────────────────────────────────
const q=document.getElementById('q'),scl=document.getElementById('scl'),rc=document.getElementById('rc');
function search(){
  const v=q.value.trim().toLowerCase();
  let n=0;
  document.querySelectorAll('section.mod[id]').forEach(sec=>{
    let m=0;
    sec.querySelectorAll('article.fn').forEach(card=>{
      const hide=!!v&&!card.dataset.s.includes(v);
      card.style.display=hide?'none':'';
      if(!hide) m++;
    });
    const noFns=sec.querySelectorAll('article.fn').length===0;
    sec.style.display=(v&&!m&&!noFns)?'none':'';
    n+=m||(noFns?1:0);
  });
  document.getElementById('empty').style.display=n?'none':'block';
  scl.style.display=v?'flex':'none';
  rc.textContent=v?(n+' found'):'';
}
q.addEventListener('input',search);
scl.onclick=()=>{q.value='';search();q.focus()};
document.addEventListener('keydown',ev=>{
  if(ev.key==='/'&&document.activeElement!==q){ev.preventDefault();q.focus();}
  if(ev.key==='Escape'&&document.activeElement===q){q.value='';search();q.blur();}
});

// ── copy buttons ──────────────────────────────────────────
document.addEventListener('click',ev=>{
  const b=ev.target.closest('.cpc');
  if(!b) return;
  const txt=decodeURIComponent(b.dataset.c);
  navigator.clipboard?.writeText(txt);
  b.innerHTML='<svg class="ic"><use href="#i-check"/></svg>Copied';
  setTimeout(()=>b.innerHTML='<svg class="ic"><use href="#i-copy"/></svg>Copy',1600);
});

// ── mobile nav ──────────────────────────────────────────
document.getElementById('mb').onclick=()=>document.getElementById('nav').classList.toggle('open');
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('nav').classList.remove('open')));

// ── theme ──────────────────────────────────────────────────
const root=document.documentElement,tb=document.getElementById('thm');
const setT=t=>{root.setAttribute('data-t',t);tb.innerHTML=`<svg class="ic"><use href="#i-${t==='dark'?'sun':'moon'}"/></svg>`};
setT(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
tb.onclick=()=>setT(root.getAttribute('data-t')==='dark'?'light':'dark');

// ── intersection observer ──────────────────────────────────────────
const navLinks=[...document.querySelectorAll('nav a[data-m]')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)navLinks.forEach(l=>l.classList.toggle('on',l.dataset.m===e.target.id))}),{rootMargin:'-20% 0px -65% 0px'});
document.querySelectorAll('section.mod[id]').forEach(s=>io.observe(s));
</script>
</body>
